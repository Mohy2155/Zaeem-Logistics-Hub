<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zaeem Logistics Hub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Heavy machinery rental, scheduling and client ledger workspace.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Set the theme before Angular boots so the page never flashes the wrong theme (see ThemeService). -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('zaeem-theme'); } catch (e) {}
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
